    <g fill="#B2C6FF" filter="url(#nodeGlow)">
      <circle cx="58" cy="51" r="5"/><circle cx="199" cy="51" r="5"/><circle cx="340" cy="51" r="5"/><circle cx="481" cy="51" r="5"/><circle cx="620" cy="51" r="5"/>
    </g>

    <!-- stage 1, fixed centering -->
    <g transform="translate(58 94)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#B2C6FF" stroke-width="2.4"/>
      <text x="0" y="6" text-anchor="middle" font-size="18" font-weight="700" class="b3">W</text>
      <text x="0" y="41" text-anchor="middle" font-size="17" class="white">WordPress /</text>
      <text x="0" y="65" text-anchor="middle" font-size="17" class="white">Web Dev</text>
    </g>
    <path d="M115 95h24M131 87l8 8-8 8" stroke="#3D6EFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(199 94)">
      <path d="M-13 -8h26l-3 22h-20z" class="iconStroke"/>
      <path d="M-6 -8a6 6 0 0 1 12 0" class="iconStroke" stroke-width="2.4"/>
      <text x="0" y="41" text-anchor="middle" font-size="17" class="white">Webflow /</text>
      <text x="0" y="65" text-anchor="middle" font-size="17" class="white">Shopify</text>
    </g>
    <path d="M256 95h24M272 87l8 8-8 8" stroke="#3D6EFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(340 94)">
      <rect x="-17" y="-12" width="34" height="24" rx="2.5" class="iconStroke"/>
      <path d="M-7 -4l-7 6 7 6M7 -4l7 6-7 6M3 -7l-6 18" class="iconStroke" stroke-width="2.3"/>
      <text x="0" y="41" text-anchor="middle" font-size="17" class="white">Custom</text>
      <text x="0" y="65" text-anchor="middle" font-size="17" class="white">Frontend</text>
    </g>
    <path d="M397 95h24M413 87l8 8-8 8" stroke="#3D6EFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(481 94)">
      <path d="M0 -15l17 9-17 9-17-9zM0 -2l17 9-17 9-17-9M0 11l17 9-17 9-17-9" class="iconStroke" stroke-width="2.5"/>
      <text x="0" y="53" text-anchor="middle" font-size="17" class="white">Full Stack</text>
    </g>
    <path d="M538 95h24M554 87l8 8-8 8" stroke="#3D6EFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(620 94)">
      <path d="M0 -16c-9 0-16 7-16 16 0 8 5 14 13 14h6c8 0 13-6 13-14 0-9-7-16-16-16z" class="iconStroke"/>
      <path d="M0 -9V9M-7 -5v10M7 -5v10" class="iconStroke" stroke-width="2.4"/>
      <text x="0" y="41" text-anchor="middle" font-size="17" class="white">AI /</text>
      <text x="0" y="65" text-anchor="middle" font-size="17" class="white">Automation</text>
    </g>
  </g>

  <!-- Footer: single clean strip with correct spacing -->
  <g class="font">
    <line x1="0" y1="526" x2="1800" y2="526" stroke="#7597FB" stroke-width="1.2" stroke-opacity="0.58"/>

    <g transform="translate(58 565)">
      <path d="M1 -8l8 8M7 -2l11-11M19 -18l7 7-15 15-7-7z" fill="none" stroke="#3D6EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="39" y="7" class="label b2">WORK WITH</text>
    </g>

    <line x1="235" y1="545" x2="235" y2="584" stroke="#7597FB" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- service list -->
    <g transform="translate(266 570)" font-size="14.5" class="muted">
      <text x="0" y="0">WordPress &amp; Elementor</text><circle cx="170" cy="-5" r="2.8" fill="#3D6EFF"/>
      <text x="187" y="0">Webflow</text><circle cx="253" cy="-5" r="2.8" fill="#3D6EFF"/>
      <text x="270" y="0">Shopify &amp; WooCommerce</text><circle cx="449" cy="-5" r="2.8" fill="#3D6EFF"/>
      <text x="466" y="0">Custom HTML/CSS/JS</text><circle cx="616" cy="-5" r="2.8" fill="#3D6EFF"/>
      <text x="633" y="0">Integrations</text><circle cx="717" cy="-5" r="2.8" fill="#3D6EFF"/>
      <text x="734" y="0">Performance &amp; Optimization</text>
    </g>

    <line x1="1262" y1="545" x2="1262" y2="584" stroke="#7597FB" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- quote has dedicated space and no overlap -->
    <g transform="translate(1300 553)">
      <path d="M0 4h12v12H0zM18 4h12v12H18z" fill="#7597FB" opacity="0.9"/>
      <path d="M4 4c0-7 3-11 8-14M22 4c0-7 3-11 8-14" fill="none" stroke="#7597FB" stroke-width="3" stroke-linecap="round"/>
      <text x="49" y="5" font-size="14.5" font-style="italic" class="muted">Build websites that do more than look good.</text>
      <text x="49" y="28" font-size="14.5" font-style="italic" class="muted">They should perform, scale and support the business behind them.</text>
    </g>
  </g>
</svg>
