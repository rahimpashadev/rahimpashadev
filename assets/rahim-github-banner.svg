<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">Rahim GitHub banner</title>
  <desc id="desc">Rahim, Web Developer, Full Stack Development, AI and Automation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1830"/>
      <stop offset="0.55" stop-color="#08162B"/>
      <stop offset="1" stop-color="#071225"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="1" r="0.85">
      <stop offset="0" stop-color="#7597FB" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#3D6EFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3D6EFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="1" cy="0" r="0.72">
      <stop offset="0" stop-color="#B2C6FF" stop-opacity="0.22"/>
      <stop offset="0.38" stop-color="#7597FB" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#3D6EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B2C6FF"/>
      <stop offset="0.50" stop-color="#7597FB"/>
      <stop offset="1" stop-color="#3D6EFF"/>
    </linearGradient>
    <linearGradient id="journeyLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B2C6FF" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#7597FB" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#3D6EFF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="nodeGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .font { font-family: "Inria Sans", "Segoe UI", Arial, sans-serif; }
      .white { fill: #F7F9FF; }
      .muted { fill: #B9C5DD; }
      .muted2 { fill: #95A8CB; }
      .b1 { fill: #3D6EFF; }
      .b2 { fill: #7597FB; }
      .b3 { fill: #B2C6FF; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 4.2px; }
      .iconStroke { fill: none; stroke: #B2C6FF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1800" height="600" fill="url(#bg)"/>
  <rect width="1800" height="600" fill="url(#glowLeft)"/>
  <rect width="1800" height="600" fill="url(#glowRight)"/>

  <!-- Minimal ambient detail -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 112 C65 83 110 45 152 0" stroke="#3D6EFF" stroke-width="1.3" stroke-opacity="0.48"/>
    <path d="M0 190 C44 203 78 226 103 260" stroke="#7597FB" stroke-width="1.1" stroke-opacity="0.40"/>
    <path d="M1540 0 C1585 60 1615 124 1628 188" stroke="#7597FB" stroke-width="1.1" stroke-opacity="0.24" stroke-dasharray="3 7"/>
    <path d="M1705 35 C1740 76 1768 118 1800 132" stroke="#3D6EFF" stroke-width="1" stroke-opacity="0.35"/>
  </g>
  <g fill="#7597FB" opacity="0.65">
    <circle cx="73" cy="222" r="3"/><circle cx="1537" cy="94" r="3"/><circle cx="1694" cy="219" r="2.6"/>
  </g>

  <!-- Soft corner arcs, intentionally understated -->
  <g opacity="0.72">
    <path d="M-120 615 A230 230 0 0 1 112 380" fill="none" stroke="#B2C6FF" stroke-width="2.2"/>
    <path d="M-94 615 A203 203 0 0 1 91 409" fill="none" stroke="#7597FB" stroke-width="1.4" stroke-opacity="0.45"/>
    <path d="M1780 -110 A220 220 0 0 0 1580 95" fill="none" stroke="#B2C6FF" stroke-width="2.1"/>
    <path d="M1805 -78 A186 186 0 0 0 1638 100" fill="none" stroke="#7597FB" stroke-width="1.3" stroke-opacity="0.5"/>
  </g>

  <!-- LEFT HERO -->
  <g class="font">
    <text x="145" y="83" font-size="29" font-weight="400" class="white">Hey, I'm <tspan font-weight="700" class="b1">Rahim</tspan></text>

    <text x="145" y="154" font-size="56" font-weight="700" class="white">I build high-performance</text>
    <text x="145" y="221" font-size="55" font-weight="700" fill="url(#accentText)">websites and digital experiences</text>

    <text x="145" y="267" font-size="24" font-weight="400" class="muted">Responsive, reliable, and built for real business use.</text>

    <!-- Explore link -->
    <g transform="translate(145 311)">
      <circle cx="17" cy="0" r="17" fill="#3D6EFF"/>
      <path d="M10 -1.5l4.2-4.2a6.2 6.2 0 0 1 8.8 8.8l-3.3 3.3M24 1.5l-4.2 4.2A6.2 6.2 0 0 1 11  -3.1l3.3-3.3M14.5 2.5l5-5" fill="none" stroke="#F7F9FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="8" font-size="23" class="muted">Explore me at <tspan font-weight="700" class="b1">rahimpasha.com</tspan></text>
      <path d="M465 0h22M480 -7l7 7-7 7" stroke="#7597FB" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- About / experience -->
    <g transform="translate(145 356)">
      <rect x="0" y="0" width="5" height="83" rx="2.5" fill="#3D6EFF"/>
      <text x="24" y="24" font-size="20" font-weight="700" class="white">Web Developer with 3+ years of experience in WordPress development</text>
      <text x="24" y="54" font-size="17" class="muted">Building responsive, production-ready websites for businesses and digital brands.</text>
    </g>

    <!-- Skills: moved down and evenly spaced -->
    <g transform="translate(169 460)" font-size="18" class="muted">
      <text x="0" y="0">WordPress</text><circle cx="111" cy="-6" r="3" fill="#3D6EFF"/>
      <text x="128" y="0">Elementor</text><circle cx="231" cy="-6" r="3" fill="#3D6EFF"/>
      <text x="248" y="0">WooCommerce</text><circle cx="390" cy="-6" r="3" fill="#3D6EFF"/>
      <text x="407" y="0">Webflow</text><circle cx="490" cy="-6" r="3" fill="#3D6EFF"/>
      <text x="507" y="0">Shopify</text>

      <text x="0" y="34">HTML</text><circle cx="63" cy="28" r="3" fill="#3D6EFF"/>
      <text x="80" y="34">CSS</text><circle cx="127" cy="28" r="3" fill="#3D6EFF"/>
      <text x="144" y="34">JavaScript</text><circle cx="248" cy="28" r="3" fill="#3D6EFF"/>
      <text x="265" y="34">Figma to Web</text>
    </g>
  </g>

  <!-- RIGHT: Currently exploring -->
  <g class="font">
    <line x1="1110" y1="55" x2="1110" y2="298" stroke="#7597FB" stroke-width="1.2" stroke-opacity="0.62"/>

    <g transform="translate(1154 79)">
      <circle cx="12" cy="0" r="11" fill="none" stroke="#7597FB" stroke-width="2.3"/>
      <path d="M8 2l2.6-6 5.5-2-2 5.4-6.1 2.6z" fill="none" stroke="#7597FB" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="39" y="6" class="label b2">CURRENTLY EXPLORING</text>
    </g>

    <!-- current exploring items -->
    <g transform="translate(1154 122)" font-size="20" class="white">
      <g transform="translate(0 0)">
        <path d="M6 -8l-7 8 7 8M16 -8l7 8-7 8M14 -11l-6 22" class="iconStroke"/>
        <text x="52" y="7">Full-Stack Development</text>
      </g>
      <g transform="translate(0 44)">
        <ellipse cx="11" cy="-7" rx="11" ry="4" class="iconStroke"/>
        <path d="M0 -7v15c0 2.3 5 4.2 11 4.2S22 10.3 22 8V-7M0 0c0 2.3 5 4.2 11 4.2S22 2.3 22 0" class="iconStroke"/>
        <text x="52" y="7">APIs &amp; Application Development</text>
      </g>
      <g transform="translate(0 88)">
        <path d="M11 -12c-7 0-12 5-12 12 0 6 4 10 9 10h6c5 0 9-4 9-10 0-7-5-12-12-12z" class="iconStroke"/>
        <path d="M11 -7v14M5 -4v8M17 -4v8" class="iconStroke" stroke-width="2.2"/>
        <text x="52" y="7">AI &amp; Automation</text>
      </g>
      <g transform="translate(0 132)">
        <path d="M11 -13l3.1 8.3L22 -1.5l-7.9 3.1L11 10 7.9 1.6 0 -1.5l7.9-3.2z" class="iconStroke"/>
        <text x="52" y="7">AI-Powered Web Products</text>
      </g>
      <g transform="translate(0 176)">
        <path d="M4 9h18a8 8 0 0 0 1-15.9A11 11 0 0 0 2-5.2 7.5 7.5 0 0 0 4 9z" class="iconStroke"/>
        <text x="52" y="7">Modern Deployment Workflows</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: Development journey -->
